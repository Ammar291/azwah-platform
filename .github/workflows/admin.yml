name: admin

on:
  push:
    branches: [main]
    paths: ["apps/admin/**", "infra/docker-compose.yml", ".github/workflows/admin.yml", "scripts/npm-audit-gate.mjs", "scripts/npm-audit-gate.test.mjs"]
  pull_request:
    paths: ["apps/admin/**", "infra/docker-compose.yml", ".github/workflows/admin.yml", "scripts/npm-audit-gate.mjs", "scripts/npm-audit-gate.test.mjs"]

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - name: Test the audit gate
        run: node --test ../../scripts/npm-audit-gate.test.mjs
      - name: Known vulnerabilities (high and critical, apart from the reviewed allowlist)
        run: npm audit --json | node ../../scripts/npm-audit-gate.mjs audit-allowlist.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build the dashboard image (infra/docker-compose.yml)
        run: docker build --tag azwah-admin:ci .
